<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | FindBack</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef4ff, #f8faff);
            color: #1e293b;
        }

        .navbar {
            background: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            color: #2563eb;
        }

        .logo span {
            color: #0f172a;
        }

        .back-btn {
            text-decoration: none;
            color: #2563eb;
            border: 1px solid #2563eb;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
        }

        .back-btn:hover {
            background: #2563eb;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 50px auto;
        }

        .profile-card {
            background: white;
            padding: 35px;
            border-radius: 22px;
            box-shadow: 0 10px 35px rgba(15, 23, 42, 0.08);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-icon {
            width: 90px;
            height: 90px;
            margin: auto;
            border-radius: 50%;
            background: #dbeafe;
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: bold;
        }

        h1 {
            margin-top: 15px;
            color: #0f172a;
            font-size: 28px;
        }

        .subtitle {
            margin-top: 8px;
            color: #64748b;
        }

        .info-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .label {
            color: #64748b;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 7px;
        }

        .value {
            color: #1e293b;
            font-size: 16px;
            word-break: break-word;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 13px;
            border-radius: 9px;
            text-align: center;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .edit-btn {
            background: #2563eb;
            color: white;
        }

        .edit-btn:hover {
            background: #1d4ed8;
        }

        .dashboard-btn {
            background: #e2e8f0;
            color: #1e293b;
        }

        .dashboard-btn:hover {
            background: #cbd5e1;
        }

        @media (max-width: 600px) {

            .container {
                margin: 30px auto;
            }

            .profile-card {
                padding: 25px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Find<span>Back</span>
        </div>

        <a href="{{ url_for('dashboard') }}" class="back-btn">
            ← Dashboard
        </a>

    </nav>

    <main class="container">

        <div class="profile-card">

            <div class="profile-header">

                <div class="profile-icon">
                    {{ user.name[0]|upper }}
                </div>

                <h1>{{ user.name }}</h1>

                <p class="subtitle">
                    Your FindBack Profile
                </p>

            </div>

            <div class="info-box">

                <div class="label">
                    Full Name
                </div>

                <div class="value">
                    {{ user.name }}
                </div>

            </div>

            <div class="info-box">

                <div class="label">
                    Email Address
                </div>

                <div class="value">
                    {{ user.email }}
                </div>

            </div>

            <div class="info-box">

                <div class="label">
                    Phone Number
                </div>

                <div class="value">
                    {{ user.phone or "Not provided" }}
                </div>

            </div>

            <div class="buttons">

                <a href="{{ url_for('edit_profile') }}"
                   class="btn edit-btn">
                    ✏️ Edit Profile
                </a>

                <a href="{{ url_for('dashboard') }}"
                   class="btn dashboard-btn">
                    Dashboard
                </a>

            </div>

        </div>

    </main>

</body>

</html>
