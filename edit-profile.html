<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile | FindBack</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef4ff, #f8faff);
            color: #1e293b;
        }

        .navbar {
            background: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            color: #2563eb;
        }

        .logo span {
            color: #0f172a;
        }

        .back-btn {
            text-decoration: none;
            color: #2563eb;
            border: 1px solid #2563eb;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
        }

        .container {
            width: 90%;
            max-width: 550px;
            margin: 50px auto;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 22px;
            box-shadow: 0 10px 35px rgba(15, 23, 42, 0.08);
        }

        h1 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #2563eb;
        }

        .save-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .save-btn:hover {
            background: #1d4ed8;
        }

        .cancel-btn {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #64748b;
            text-decoration: none;
        }

        .cancel-btn:hover {
            color: #2563eb;
        }

        @media (max-width: 600px) {

            .form-card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Find<span>Back</span>
        </div>

        <a href="{{ url_for('profile') }}" class="back-btn">
            ← Profile
        </a>

    </nav>

    <main class="container">

        <div class="form-card">

            <h1>Edit Profile ✏️</h1>

            <p class="subtitle">
                Update your account information
            </p>

            <form method="POST">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        value="{{ user.name }}"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="{{ user.email }}"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        value="{{ user.phone or '' }}"
                        maxlength="15"
                    >

                </div>

                <button
                    type="submit"
                    class="save-btn"
                >
                    Save Changes
                </button>

            </form>

            <a href="{{ url_for('profile') }}"
               class="cancel-btn">
                Cancel
            </a>

        </div>

    </main>

</body>

</html>
